name: Backend Sonar

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report (all severities)
        run: |
          npm audit --omit=dev --json > audit-report.json || true
          {
            echo "## Dependency audit report (all severities)"
            echo ""
            echo '```'
            npm audit --omit=dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-report
          path: audit-report.json
          retention-days: 14

      - name: Dependency vulnerability gate (high/critical, production)
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        with:
          scannerVersion: 8.0.1.6346
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
